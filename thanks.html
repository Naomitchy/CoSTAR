    <!-- 共通スタイル（色・フォント・アニメーション） -->
    <style>
        @layer theme, base, components, utilities;

        /* ---------- Design Tokens ---------- */
        :root {
            --accent: #B8962E;
            --accent-dark: #9e8022;
            --accent-deep: #8F7320;
            --ink: #333333;
            --muted: #666666;
            --subtle: #999999;
            --paper: #F9FAFB;
            --cream: #FDFBF7;
            --sand: #EAEAE6;
            --urgent: #d9534f;

            --font-gothic: "Noto Sans JP", "Helvetica Neue", Arial, sans-serif;
            --font-mincho: "Shippori Mincho", serif;

            --shadow-soft: 0 10px 30px rgba(0, 0, 0, 0.05);
            --shadow-gold: 0 20px 40px rgba(184, 150, 46, 0.15);

            color-scheme: light;
        }

        /* ---------- Base ---------- */
        @layer base {
            html {
                scroll-behavior: smooth;
                scroll-padding-top: 72px;
            }

            body {
                margin: 0;
                font-family: var(--font-gothic);
                background: var(--paper);
                color: var(--ink);
                line-height: 2;
                letter-spacing: 0.05em;
                font-feature-settings: "palt";
                overflow-x: hidden;
                -webkit-font-smoothing: antialiased;
            }

            h1, h2, h3, h4 {
                font-family: var(--font-mincho);
            }

            a {
                transition: 0.3s;
            }

            :focus-visible {
                outline: 2px solid var(--accent);
                outline-offset: 2px;
            }
        }

        @keyframes drawCheck {
            0% { opacity: 0; transform: rotate(45deg) scale(0.5); }
            100% { opacity: 1; transform: rotate(45deg) scale(1); }
        }
    </style>

    <!-- Tailwind テーマ（上の :root の値を Tailwind のクラス名に対応付け） -->
    <style type="text/tailwindcss">
        @theme inline {
            --color-accent: var(--accent);
            --color-accent-dark: var(--accent-dark);
            --color-accent-deep: var(--accent-deep);
            --color-ink: var(--ink);
            --color-muted: var(--muted);
            --color-subtle: var(--subtle);
            --color-paper: var(--paper);
            --color-cream: var(--cream);
            --color-sand: var(--sand);
            --color-urgent: var(--urgent);
            --font-sans: var(--font-gothic);
            --font-serif: var(--font-mincho);
            --shadow-soft: var(--shadow-soft);
            --shadow-gold: var(--shadow-gold);
            --animate-fade-in: fadeIn 2s ease-out;
            --animate-slide-in: slideIn 0.4s ease;
            --animate-draw-check: drawCheck 0.5s ease forwards;
        }
    </style>
